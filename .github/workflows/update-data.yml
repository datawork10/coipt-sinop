name: Atualizar dados da COIPT e publicar no GitHub Pages

on:
  schedule:
    # Executa a cada 6 horas. Horário em UTC (MT = UTC-4): 20h, 2h, 8h e 14h em MT.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}   # permite rodar manualmente pela aba "Actions" no GitHub
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 1) Atualiza os dados e prepara o pacote do site
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gerar data.json a partir da planilha Google Sheets
        run: |
          python3 scripts/build_data.py \
            --sheet-id "${{ secrets.SHEET_ID }}" \
            --out data.json

      - name: Commitar data.json atualizado (se houve mudança)
        run: |
          git config user.name "coipt-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- data.json; then
            git add data.json
            git commit -m "chore: atualiza data.json automaticamente"
            git push
          else
            echo "Nenhuma mudança nos dados — nada para commitar."
          fi

      - name: Preparar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  # 2) Publica em um job separado (padrão recomendado pelo GitHub):
  #    evita a falha "No artifacts named github-pages were found",
  #    que ocorre quando a publicação roda antes de o pacote ficar disponível.
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Aguardar antes de tentar de novo
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Publicar no GitHub Pages (2ª tentativa)
        id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
